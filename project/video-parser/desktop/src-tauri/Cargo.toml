[package]
name = "yinglian-desktop"
version = "1.11.0"
description = "轻量、非阻塞的本地视频与多语言文案下载工具"
authors = ["359073395"]
edition = "2021"

[lib]
name = "yinglian_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
team-smoke = []

[[example]]
name = "team-smoke"
required-features = ["team-smoke"]

[[example]]
name = "personal-preview"
required-features = ["team-smoke"]

[[example]]
name = "automation-smoke"
required-features = ["team-smoke"]

[[example]]
name = "account-smoke"
required-features = ["team-smoke"]

[[example]]
name = "tiktok-smoke"
required-features = ["team-smoke"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[[example]]
name = "engine-smoke"
required-features = ["team-smoke"]

[dependencies]
base64 = "0.23.1"
flate2 = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "form"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
tiny_http = "0.12"
url = "2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
prost = "0.14"
regex = "1"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
