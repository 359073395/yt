name: Video Parser 2.3 CI

on:
  push:
    branches: [main]
    paths:
      - "project/video-parser/**"
      - ".github/workflows/video-parser-ci.yml"
  pull_request:
    paths:
      - "project/video-parser/**"
      - ".github/workflows/video-parser-ci.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/video-parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project/video-parser/backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -q backend/tests
        env:
          PYTHONPATH: backend
          DOWNLOAD_DIR: ${{ runner.temp }}/yinglian-downloads
          DATABASE_PATH: ${{ runner.temp }}/yinglian.sqlite3
          COOKIE_DIR: ${{ runner.temp }}/yinglian-cookies
          AUTH_SECRET: ci-only-secret
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: project/video-parser/frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend

  extractor-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/video-parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pip install -r backend/requirements.txt
      - name: YouTube public test metadata
        continue-on-error: true
        run: python -m yt_dlp --ignore-config --js-runtimes deno --no-playlist --skip-download --print id "https://www.youtube.com/watch?v=MeJVWBSsPAY"

  container-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/video-parser
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build --file deploy/Dockerfile --tag video-parser:smoke .
      - name: Verify legacy-volume migration, startup and health endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          docker volume create video-parser-smoke-data >/dev/null
          docker run --rm \
            --user 0:0 \
            --entrypoint sh \
            -v video-parser-smoke-data:/data \
            video-parser:smoke \
            -c 'mkdir -p /data/downloads && touch /data/downloads/legacy-root-file && chown -R 0:0 /data && chmod 755 /data /data/downloads'
          docker create \
            --name video-parser-legacy \
            --entrypoint sh \
            -v video-parser-smoke-data:/data \
            video-parser:smoke \
            -c 'sleep 600' >/dev/null
          bash deploy/migrate-data-permissions.sh video-parser-legacy video-parser:smoke
          docker rm video-parser-legacy >/dev/null
          docker run -d --name video-parser-smoke \
            -p 127.0.0.1:18080:8080 \
            -e AUTH_SECRET=ci-smoke-auth-secret \
            -v video-parser-smoke-data:/data \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m,uid=10001,gid=10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            video-parser:smoke
          cleanup() {
            docker rm -f video-parser-smoke >/dev/null 2>&1 || true
            docker rm -f video-parser-legacy >/dev/null 2>&1 || true
            docker volume rm video-parser-smoke-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          response=""
          for _ in $(seq 1 40); do
            response="$(curl -fsS --max-time 5 http://127.0.0.1:18080/api/health 2>/dev/null || true)"
            if [[ "$response" == *'"version":"2.3.0"'* && "$response" == *'"chromium":"available"'* && "$response" == *'"qr_login":"available"'* && "$response" == *'"transcription":"available"'* ]]; then
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' video-parser-smoke 2>/dev/null || true)" != "true" ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$response" != *'"version":"2.3.0"'* || "$response" != *'"chromium":"available"'* || "$response" != *'"qr_login":"available"'* || "$response" != *'"transcription":"available"'* ]]; then
            echo "Unexpected health response: ${response:-no response}"
            docker inspect video-parser-smoke
            docker logs video-parser-smoke
            exit 1
          fi
          echo "$response"
          docker exec video-parser-smoke python -c 'from faster_whisper import WhisperModel; print("faster-whisper-import-ok")'
          docker exec -i video-parser-smoke python - <<'PY'
          import asyncio

          from playwright.async_api import async_playwright


          async def main() -> None:
              async with async_playwright() as playwright:
                  browser = await playwright.chromium.launch(
                      executable_path="/usr/bin/chromium",
                      headless=True,
                      args=["--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu"],
                  )
                  page = await browser.new_page()
                  await page.set_content("<title>browser-ok</title><canvas id='qr' width='170' height='170'></canvas>")
                  assert await page.title() == "browser-ok"
                  from app.qr_login import QrLoginManager
                  qr = await QrLoginManager._find_qr(page, "tiktok")
                  assert await qr.screenshot(type="png")
                  await page.set_content("<img alt='Scan me!' width='140' height='140'>")
                  qr = await QrLoginManager._find_qr(page, "bilibili")
                  assert await qr.screenshot(type="png")
                  await browser.close()


          asyncio.run(main())
          PY

  image:
    if: >-
      always() && needs.test.result == 'success' && needs.container-smoke.result == 'success' &&
      (needs.extractor-smoke.result == 'success' || needs.extractor-smoke.result == 'skipped') &&
      github.event_name != 'pull_request'
    needs: [test, container-smoke, extractor-smoke]
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      context: project/video-parser
      file: deploy/Dockerfile
      cache: true
      cache-mode: max
      cache-scope: video-parser
      sbom: true
      set-meta-labels: true
      meta-images: ghcr.io/359073395/video-parser
      meta-tags: |
        type=raw,value=latest
        type=raw,value=2.3.0
        type=sha
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
