name: Video Parser Desktop CI

on:
  push:
    branches: [main]
    tags: ["video-parser-desktop-v*"]
    paths:
      - "project/video-parser/desktop/**"
      - ".github/workflows/video-parser-desktop.yml"
  pull_request:
    paths:
      - "project/video-parser/desktop/**"
      - ".github/workflows/video-parser-desktop.yml"
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Existing successful candidate run to test on a disposable Windows runner (empty builds a candidate)'
        required: false
        default: ''
      artifact_source_sha:
        description: 'Exact source commit of that candidate'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.artifact_run_id == '' }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: project/video-parser/desktop
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: project/video-parser/desktop/package-lock.json
      - name: Use stable Rust
        run: rustup default stable
      - run: npm ci
      - name: Prepare official Windows runtimes
        run: npm run prepare:runtime
      - run: npm test -- --run
      - run: npm run test:runtime
      - name: Verify bundled TikTok plugin against pinned yt-dlp
        shell: pwsh
        run: |
          $version = (Get-Content -Raw scripts/runtime-lock.json | ConvertFrom-Json).ytDlp.version
          python -m pip install "yt-dlp==$version"
          if ($LASTEXITCODE) { throw 'QA yt-dlp install failed' }
          python -X utf8 qa/test_tiktok_live_plugin.py
          if ($LASTEXITCODE) { throw 'TikTok plugin compatibility tests failed' }
      - name: Native regression tests
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml
      - run: npm audit --omit=dev
      - name: Audit locked native Windows dependencies
        run: python scripts/audit-native.py --output qa/native-audit.json
      - name: Build NSIS installer for CI
        if: ${{ !startsWith(github.ref, 'refs/tags/video-parser-desktop-v') }}
        run: npm run build -- --config src-tauri/tauri.build-only.conf.json
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !startsWith(github.ref, 'refs/tags/video-parser-desktop-v') }}
        with:
          name: yinglian-desktop-${{ github.sha }}
          path: project/video-parser/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Require real acceptance evidence before publishing
        if: startsWith(github.ref, 'refs/tags/video-parser-desktop-v')
        run: node scripts/check-release-gate.mjs
      - name: Build signed updater and publish tagged release
        if: startsWith(github.ref, 'refs/tags/video-parser-desktop-v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: project/video-parser/desktop
          tagName: video-parser-desktop-v__VERSION__
          releaseName: 跑量影链工坊 Desktop __VERSION__
          releaseBody: |
            Windows x64。开源组件维护更新，更新、升级及验证范围见随包对应版本 RELEASE 文档。保留工作台配置；旧独立稳定版不自动切换数据。
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: Paoliang-YingLian_[version]_x64[setup][ext]
          args: --bundles nsis
      - name: Keep legacy update channel separate in release draft
        if: startsWith(github.ref, 'refs/tags/video-parser-desktop-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          node scripts/verify-updater.mjs $installer.FullName ($installer.FullName + '.sig')
          if ($LASTEXITCODE) { throw 'Installer does not match the application updater public key' }
          $tag = '${{ github.ref_name }}'
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $notes = "RELEASE-$version.md"
          if ($tag -ne "video-parser-desktop-v$version" -or !(Test-Path $notes)) { throw 'Release tag or notes do not match package version' }
          $newDir = Join-Path $env:RUNNER_TEMP 'paoliang-update'
          $legacyDir = Join-Path $env:RUNNER_TEMP 'legacy-update'
          New-Item -ItemType Directory -Path $newDir,$legacyDir -Force | Out-Null
          gh release download $tag --repo '${{ github.repository }}' --pattern latest.json --dir $newDir
          if ($LASTEXITCODE) { throw 'Signed updater manifest missing' }
          node scripts/update-channel.mjs (Join-Path $newDir 'latest.json') (Join-Path $newDir 'paoliang-latest.json') '${{ github.repository }}'
          if ($LASTEXITCODE) { throw 'Public channel validation failed' }
          gh release download video-parser-desktop-v1.1.8 --repo '${{ github.repository }}' --pattern latest.json --dir $legacyDir
          if ($LASTEXITCODE) { throw 'Legacy channel manifest unavailable; do not publish' }
          gh release upload $tag (Join-Path $newDir 'paoliang-latest.json') (Join-Path $legacyDir 'latest.json') $notes --clobber --repo '${{ github.repository }}'
          if ($LASTEXITCODE) { throw 'Channel upload failed' }
          gh release edit $tag --notes-file $notes --repo '${{ github.repository }}'
          if ($LASTEXITCODE) { throw 'Release notes update failed' }
          # Keep draft until the actual signed CI installer is checked locally.
  installer-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '' }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - name: Verify candidate identity and previous signature, then upgrade
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN: ${{ inputs.artifact_run_id }}
          SOURCE_SHA: ${{ inputs.artifact_source_sha }}
        run: |
          $ErrorActionPreference='Stop'
          if ($env:SOURCE_RUN -notmatch '^\d+$' -or $env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid candidate identity' }
          $run=gh run view $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --json headSha,conclusion | ConvertFrom-Json
          if ($LASTEXITCODE -or $run.headSha -ne $env:SOURCE_SHA -or $run.conclusion -ne 'success') { throw 'Candidate source or build status mismatch' }
          $candidateDir=Join-Path $env:RUNNER_TEMP 'candidate'
          $previousDir=Join-Path $env:RUNNER_TEMP 'previous'
          gh run download $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name "yinglian-desktop-$($env:SOURCE_SHA)" --dir $candidateDir
          if ($LASTEXITCODE) { throw 'Candidate download failed' }
          gh release download video-parser-desktop-v1.10.2 --repo $env:GITHUB_REPOSITORY --pattern 'Paoliang-YingLian_1.10.2_x64-setup.exe*' --dir $previousDir
          if ($LASTEXITCODE) { throw 'Previous signed installer download failed' }
          $candidate=@(Get-ChildItem -LiteralPath $candidateDir -File -Filter '*.exe')
          if ($candidate.Count -ne 1) { throw 'Expected one candidate installer' }
          $previous=Join-Path $previousDir 'Paoliang-YingLian_1.10.2_x64-setup.exe'
          node project/video-parser/desktop/scripts/verify-updater.mjs $previous ($previous+'.sig')
          if ($LASTEXITCODE) { throw 'Previous installer signature invalid' }
          & project/video-parser/desktop/qa/verify-installer-upgrade.ps1 -PreviousInstaller $previous -CandidateInstaller $candidate[0].FullName -SourceSha $env:SOURCE_SHA -ReceiptPath (Join-Path $env:RUNNER_TEMP 'installer-upgrade-receipt.json')
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: yinglian-installer-acceptance-${{ inputs.artifact_source_sha }}
          path: ${{ runner.temp }}/installer-upgrade-receipt.json
          if-no-files-found: warn
