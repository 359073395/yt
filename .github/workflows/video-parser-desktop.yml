name: Video Parser Desktop CI

on:
  push:
    branches: [main]
    tags: ["video-parser-desktop-v*"]
    paths:
      - "project/video-parser/desktop/**"
      - ".github/workflows/video-parser-desktop.yml"
  pull_request:
    paths:
      - "project/video-parser/desktop/**"
      - ".github/workflows/video-parser-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: project/video-parser/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: project/video-parser/desktop/package-lock.json
      - name: Use stable Rust
        run: rustup default stable
      - run: npm ci
      - name: Prepare official Windows runtimes
        run: npm run prepare:runtime
      - run: npm test -- --run
      - run: npm audit --omit=dev
      - name: Build NSIS installer for CI
        if: ${{ !startsWith(github.ref, 'refs/tags/video-parser-desktop-v') }}
        run: npm run build -- --config src-tauri/tauri.build-only.conf.json
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/video-parser-desktop-v') }}
        with:
          name: yinglian-desktop-${{ github.sha }}
          path: project/video-parser/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Build signed updater and publish tagged release
        if: startsWith(github.ref, 'refs/tags/video-parser-desktop-v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: project/video-parser/desktop
          tagName: video-parser-desktop-v__VERSION__
          releaseName: 影链工坊 Desktop __VERSION__
          releaseBody: |
            Windows 桌面版。此版本支持应用内检查、签名验证、一键安装并自动重启。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: YingLian-Desktop_[version]_x64[setup][ext]
          args: --bundles nsis
