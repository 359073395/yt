name: Video Parser Desktop CI

on:
  push:
    branches: [main]
    tags: ["video-parser-desktop-v*"]
    paths:
      - "project/video-parser/desktop/**"
      - ".github/workflows/video-parser-desktop.yml"
  pull_request:
    paths:
      - "project/video-parser/desktop/**"
      - ".github/workflows/video-parser-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: project/video-parser/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: project/video-parser/desktop/package-lock.json
      - name: Use stable Rust
        run: rustup default stable
      - run: npm ci
      - name: Prepare official Windows runtimes
        run: npm run prepare:runtime
      - run: npm test -- --run
      - run: npm audit --omit=dev
      - name: Build NSIS installer
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: yinglian-desktop-${{ github.sha }}
          path: project/video-parser/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/video-parser-desktop-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (gh release view $env:GITHUB_REF_NAME 2>$null) {
            gh release upload $env:GITHUB_REF_NAME $installer.FullName --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $installer.FullName --verify-tag --title "影链工坊 Desktop $($env:GITHUB_REF_NAME.Replace('video-parser-desktop-v', ''))" --generate-notes
          }
